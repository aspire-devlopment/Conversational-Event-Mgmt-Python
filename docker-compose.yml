services:
  db:
    image: postgres:16-alpine
    container_name: conversational-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: EVENT_MANAGEMENT_SYSTEM
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EVENT_MANAGEMENT_SYSTEM"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-python
    container_name: conversational-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_RELOAD: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URLS: http://localhost:3000,http://127.0.0.1:3000
      FORCE_HTTPS: "false"
      TRUSTED_HOSTS: localhost,127.0.0.1
      LOGS_ROOT: logs
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pass123
      DB_NAME: EVENT_MANAGEMENT_SYSTEM
      JWT_SECRET: change_this_secret
      JWT_EXPIRATION: 7d
      LLM_PROVIDER: groq
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: llama-3.3-70b-versatile
      LLM_TEMPERATURE: 0.4
      LLM_TIMEOUT_MS: 30000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: llama-3.3-70b-versatile
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_TIMEOUT_MS: 30000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: openrouter/auto
      OPENROUTER_API_URL: https://openrouter.ai/api/v1/chat/completions
      OPENROUTER_TIMEOUT_MS: 30000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_TIMEOUT_MS: 30000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: conversational-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
